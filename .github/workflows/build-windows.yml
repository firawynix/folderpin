name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application and installer
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: firaw-taskbar-${{ github.ref_name }}
          path: |
            Firaw - TaskBar.exe
            Firaw - TaskBar Studio.exe
            Firaw - TaskBar Setup.exe
          if-no-files-found: error

